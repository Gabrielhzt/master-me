services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: development
      
      DATABASE_URL: postgresql://postgres:password@db:5432/master-me
      CLIENT_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3001
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-replace-me-with-a-32-char-minimum-secret}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-onboarding@resend.dev}
      GROQ_API_KEY: ${GROQ_API_KEY:-}

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: master-me
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data/18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d master-me"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

